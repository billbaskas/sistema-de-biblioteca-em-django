{% extends "biblioteca/base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
  <h1>{{ titulo }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-verde">Salvar</button>
    <a class="btn btn-cinza" href="javascript:history.back()">Cancelar</a>
  </form>
{% endblock %}
