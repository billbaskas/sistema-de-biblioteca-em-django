<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Biblioteca{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
    nav { background: #1f3a5f; padding: 14px 24px; }
    nav a { color: #fff; margin-right: 20px; text-decoration: none; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    main { max-width: 900px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; }
    th { background: #eef1f5; }
    .btn { display: inline-block; padding: 6px 12px; border-radius: 4px; border: 0; color: #fff;
           background: #1f3a5f; text-decoration: none; cursor: pointer; font-size: 14px; }
    .btn-verde { background: #2e8b57; }
    .btn-amarelo { background: #c98a00; }
    .btn-vermelho { background: #c0392b; }
    .btn-cinza { background: #777; }
    .msg { padding: 10px 14px; border-radius: 4px; margin-bottom: 12px; }
    .msg.success { background: #d4edda; color: #155724; }
    .msg.warning { background: #fff3cd; color: #856404; }
    .msg.error { background: #f8d7da; color: #721c24; }
    form p { margin: 12px 0; }
    form label { display: block; font-weight: bold; margin-bottom: 4px; }
    form input, form select { padding: 8px; width: 100%; max-width: 400px; box-sizing: border-box; }
    .errorlist { color: #c0392b; list-style: none; padding: 0; margin: 4px 0; }
    .cards { display: flex; gap: 16px; margin-top: 16px; }
    .card { flex: 1; background: #eef1f5; padding: 20px; border-radius: 8px; text-align: center; }
    .card strong { font-size: 32px; display: block; }
    form.inline { display: inline; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'home' %}">Início</a>
    <a href="{% url 'autor_listar' %}">Autores</a>
    <a href="{% url 'livro_listar' %}">Livros</a>
  </nav>
  <main>
    {% if messages %}
      {% for message in messages %}
        <div class="msg {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
